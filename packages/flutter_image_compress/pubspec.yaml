name: flutter_image_compress
description: Compress Pictures. Can effectively reduce the size of the transmission.
repository: https://github.com/fluttercandies/flutter_image_compress
version: 2.5.2

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Path deps so git consumers of this fork pick up sibling package fixes
  # (e.g. Android KGP / AGP 9) without needing multiple overrides.
  flutter_image_compress_platform_interface:
    path: ../flutter_image_compress_platform_interface
  flutter_image_compress_common:
    path: ../flutter_image_compress_common
  flutter_image_compress_web:
    path: ../flutter_image_compress_web
  flutter_image_compress_macos:
    path: ../flutter_image_compress_macos
  flutter_image_compress_ohos:
    path: ../flutter_image_compress_ohos

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_image_compress_common
      ios:
        default_package: flutter_image_compress_common
      macos:
        default_package: flutter_image_compress_macos
      web:
        default_package: flutter_image_compress_web
      ohos:
        default_package: flutter_image_compress_ohos    